name: CSharp CI

on: [push]


jobs:
  build:
    runs-on: macos-latest

  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-dotnet@v4
     with:
       dotnet-version: '8.0.x'
   - name: Run unit checks
     run: dotnet test Timesheet.Test --filter FullyQualifiedName~Timesheet.Test.Unit

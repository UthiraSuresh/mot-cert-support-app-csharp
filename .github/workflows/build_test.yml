name: CSharp CI

on: [push]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run unit checks (with TRX)
        run: dotnet test Timesheet.Test/Timesheet.Test.csproj --filter FullyQualifiedName~Timesheet.Test.Unit --logger "trx" --results-directory "./test-results"

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            test-results/*.trx